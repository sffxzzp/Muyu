name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set build version and validate release tags
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo 'Use a version tag such as v1.0.0 or v1.1.0-rc.1.' >&2
              exit 1
            fi
            release_version="$GITHUB_REF_NAME"
          else
            release_version="dev-${GITHUB_SHA:0:12}"
          fi
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: web/dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  checks:
    name: Test on ${{ matrix.runner }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: bin/muyu
          - runner: windows-latest
            binary: bin/muyu.exe
          - runner: macos-latest
            binary: bin/muyu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: web/dist
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Build native executable
        env:
          CGO_ENABLED: '0'
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags='-s -w' -o "$BINARY" ./cmd/muyu
      - name: Run from a directory containing only the executable
        env:
          BINARY: ${{ matrix.binary }}
        run: python scripts/smoke_test.py --binary "$BINARY" --assets web/dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser regression tests
        if: runner.os == 'Linux'
        working-directory: web
        run: npm run test:e2e
      - name: Browser screenshots and failure traces
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report
          path: |
            artifacts/*.png
            web/test-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: web/dist
      - name: Cross-compile and package
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.frontend.outputs.version }}
        run: |
          mkdir -p bin
          binary="bin/muyu"
          if [[ "$GOOS" == windows ]]; then binary="${binary}.exe"; fi
          go build -trimpath -ldflags='-s -w' -o "$binary" ./cmd/muyu
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 scripts/package_release.py \
            --binary "$binary" --goos "$GOOS" --goarch "$GOARCH" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/releases/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  docker:
    name: Docker image (amd64 and arm64)
    needs: [checks, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Container image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build a local image for the startup check
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: muyu:ci
          cache-from: type=gha,scope=muyu-image
          cache-to: type=gha,mode=max,scope=muyu-image
      - name: Check container port mapping and embedded website
        shell: bash
        run: |
          docker run --detach --name muyu-ci --publish 127.0.0.1:17777:7777 muyu:ci
          python3 scripts/smoke_test.py --url http://127.0.0.1:17777
      - name: Container logs and cleanup
        if: always()
        shell: bash
        run: |
          if docker container inspect muyu-ci > /dev/null 2>&1; then
            docker logs muyu-ci
            docker rm --force muyu-ci
          fi
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Log in to GHCR for a version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures and publish version tags
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=muyu-image
          cache-to: type=gha,mode=max,scope=muyu-image

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts/releases
          merge-multiple: true
      - name: Verify release archives
        working-directory: artifacts/releases
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 6
          LC_ALL=C sort -k2 ./*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload assets and publish after all builds passed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DOCKER_IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          image = os.environ['DOCKER_IMAGE']
          tag = os.environ['RELEASE_TAG']
          Path('release-notes.md').write_text(
              f'MUYU {tag}\n\n'
              'Binaries include the complete website; Go and Node are not required to run them.\n\n'
              '- Windows: extract the ZIP and run `muyu.exe`.\n'
              '- Linux / macOS: extract the tar.gz and run `./muyu`.\n'
              '- Open http://127.0.0.1:7777 in your browser.\n'
              '- Each archive includes usage instructions, build information, and third-party notices.\n'
              '- Checksums are available in `SHA256SUMS.txt`.\n\n'
              f'Docker (amd64 / arm64):\n```sh\ndocker run --rm -p 127.0.0.1:7777:7777 {image}:{tag}\n```\n',
              encoding='utf-8',
          )
          PY
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "MUYU $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            artifacts/releases/*.zip artifacts/releases/*.tar.gz \
            artifacts/releases/SHA256SUMS.txt --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          fi
